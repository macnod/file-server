services:
  pgtest:
    image: postgres:16
    environment:
      POSTGRES_HOST: "$DB_HOST"
      POSTGRES_DATABASE: "$DB_NAME"
      POSTGRES_USER: "$DB_USER"
      POSTGRES_PASSWORD: "$DB_PASSWORD"
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./tests/db-init:/docker-entrypoint-initdb.d
