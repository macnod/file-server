apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-{{ .Values.environment }}-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgres.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "fileserver"
            - name: POSTGRES_USER
              value: "fileserver"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: file-server-{{ .Values.environment }}-secrets
                  key: postgres-password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - fileserver
                - -d
                - fileserver
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 2
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - fileserver
                - -d
                - fileserver
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pg-data
            - mountPath: /docker-entrypoint-initdb.d
              name: init-sql
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: pg-{{ .Values.environment }}-pvc
        - name: init-sql
          configMap:
            name: init-sql
            defaultMode: 0644
