apiVersion: v1
kind: PersistentVolume
metadata:
  name: pg-{{ .Values.environment }}-pv
  namespace: {{ .Values.namespace }}
spec:
  capacity:
    storage: {{ .Values.postgres.storageSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /pg-data/{{ .Values.environment }}
    type: DirectoryOrCreate
